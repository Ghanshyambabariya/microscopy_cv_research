[project]
name = "microscopy-cv-research"
version = "0.1.0"
description = "Materials-AI benchmark platform for microscopy CV, process-signal ML, and structure-property prediction"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Ghanshyambabariya", email = "Ghanshyambabariya1111@gmail.com" }
]
dependencies = [
  "torch>=2.2",
  "torchvision>=0.17",
  "timm>=1.0",
  "numpy>=1.26",
  "pandas>=2.2",
  "scikit-learn>=1.4",
  "matplotlib>=3.8",
  "pillow>=10.0"
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
