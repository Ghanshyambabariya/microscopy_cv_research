[project]
name = "materials-ml-research-projects"
version = "0.1.0"
description = "Separate materials-ML research projects for microscopy CV, process-signal ML, tool wear, and property prediction"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "Ghanshyambabariya", email = "Ghanshyambabariya1111@gmail.com" }
]
dependencies = [
  "torch>=2.2",
  "torchvision>=0.17",
  "timm>=1.0",
  "numpy>=1.26",
  "pandas>=2.2",
  "scikit-learn>=1.4",
  "xgboost>=2.0",
  "shap>=0.46",
  "matplotlib>=3.8",
  "pillow>=10.0"
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
